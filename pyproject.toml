[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-orchestrator"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10",
]

[tool.mutmut]
source_paths = [
  "validation/architecture_dependency_validator.py",
]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_architecture_dependency_validator.py",
  "tests/architecture/test_dependency_direction.py",
  "tests/validation/test_architecture_dependency_validator.py",
]
also_copy = ["domain/common"]

mutate_only_covered_lines = false

debug = true
