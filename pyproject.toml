[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-orchestrator"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10",
]

[tool.mutmut]
source_paths = [
  "domain/market_data_event.py",
  "persistence/market_data_store.py",
  "shared/contracts/equity_curve.py",
  "backtest/engine.py",
]
pytest_add_cli_args_test_selection = [
  "tests/contract/test_backtest_interfaces.py",
  "tests/contract/test_market_data_store.py",
  "tests/contract/test_market_data_event.py",
  "tests/integration/test_backtest_flow.py",
  "tests/unit/test_market_data_event.py",
  "tests/unit/test_timeframe.py",
]
also_copy = ["domain/common"]

mutate_only_covered_lines = false

debug = true
