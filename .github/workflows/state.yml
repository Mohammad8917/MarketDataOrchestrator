# Retained for manual recovery only.
# Automatic repository state synchronization is owned by repository-truth-sync.yml.
name: Auto State (Manual Recovery)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  manual-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate canonical state
        env:
          STATE_SOURCE_SHA: ${{ github.sha }}
          STATE_EVENT_NAME: workflow_dispatch
          STATE_EVENT_RUN_ID: ${{ github.run_id }}
        run: python scripts/generate_state.py
      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md docs/STATUS.md evidence/sha_status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: recover canonical project state [skip ci]"
          git push origin HEAD:main
