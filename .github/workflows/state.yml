name: Auto State

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "PROJECT_STATE.md"
      - "evidence/sha_status/**"
  workflow_run:
    workflows: ["Compliance CI", "ci"]
    types: [completed]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Determine target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "branch=$WORKFLOW_BRANCH" >> "$GITHUB_OUTPUT"
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$PUSH_BRANCH" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve Compliance CI run
        if: github.event_name == 'push'
        id: resolve_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          for attempt in $(seq 1 20); do
            RUN_JSON=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&per_page=10" || true)
            RUN_ID=$(python -c 'import json,sys; d=json.load(sys.stdin); runs=d.get("workflow_runs", []); print(next((str(r["id"]) for r in runs if r.get("head_sha") == sys.argv[1] and r.get("name") == "Compliance CI"), ""))' "$TARGET_SHA" <<< "$RUN_JSON" 2>/dev/null || true)

            if [ -n "$RUN_ID" ]; then
              STATUS=$(python -c 'import json,sys; d=json.load(sys.stdin); runs=d.get("workflow_runs", []); r=next((x for x in runs if str(x.get("id")) == sys.argv[1]), {}); print(r.get("status",""))' "$RUN_ID" <<< "$RUN_JSON" 2>/dev/null || true)
              if [ "$STATUS" = "completed" ]; then
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done

          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "Compliance CI result not available yet; state will remain PENDING."

      - name: Collect Compliance CI result
        if: github.event_name == 'workflow_run' || steps.resolve_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_RUN_ID: ${{ steps.target.outputs.run_id }}
          RESOLVED_RUN_ID: ${{ steps.resolve_ci.outputs.run_id }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          RUN_ID="$EVENT_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$RESOLVED_RUN_ID"
          fi

          mkdir -p evidence/sha_status
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          jobs = json.loads(Path("/tmp/jobs.json").read_text(encoding="utf-8"))
          target_sha = os.environ["TARGET_SHA"]
          run_id = int(os.environ["EVENT_RUN_ID"] or os.environ["RESOLVED_RUN_ID"])

          mapping = {
              "G01_FORMAT_LINT": "G01",
              "G02_TYPECHECK": "G02",
              "G03_UNIT_CONTRACT": "G03",
              "G04_ARCHITECTURE_DEPENDENCY": "G04",
              "G05_COVERAGE": "G05",
              "G06_SECURITY_SUPPLY_CHAIN": "G06",
              "G07_INTEGRATION_RESILIENCE": "G07",
          }

          gates = {value: "PENDING" for value in mapping.values()}

          for job in jobs.get("jobs", []):
              gate = mapping.get(job.get("name"))
              if not gate:
                  continue
              conclusion = job.get("conclusion")
              if conclusion == "success":
                  gates[gate] = "PASS"
              elif conclusion == "skipped":
                  gates[gate] = "SKIPPED"
              elif conclusion:
                  gates[gate] = "FAIL"

          overall = (
              "PASS"
              if all(value in {"PASS", "SKIPPED"} for value in gates.values())
              else "FAIL"
          )

          payload = {
              "sha": target_sha,
              "run_id": run_id,
              "status": overall,
              "gates": gates,
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }

          Path("evidence/sha_status").joinpath(
              f"{target_sha}.json"
          ).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Abort stale target
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          CURRENT_SHA=$(git rev-parse "origin/$TARGET_BRANCH")
          if [ "$CURRENT_SHA" != "$TARGET_SHA" ]; then
            echo "Target SHA is stale; a newer commit already exists on $TARGET_BRANCH."
            exit 0
          fi

      - name: Retain latest 100 state evidences
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          evidence_dir = Path("evidence/sha_status")
          files = sorted(evidence_dir.glob("*.json")) if evidence_dir.exists() else []
          if len(files) <= 100:
              print(f"State evidence count: {len(files)}; nothing to prune.")
              raise SystemExit(0)

          def commit_timestamp(path: Path) -> int:
              sha = path.stem
              result = subprocess.run(
                  ["git", "show", "-s", "--format=%ct", sha],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if result.returncode == 0 and result.stdout.strip().isdigit():
                  return int(result.stdout.strip())
              return 0

          files.sort(key=lambda path: (commit_timestamp(path), path.name), reverse=True)
          for path in files[100:]:
              print(f"Removing old state evidence: {path}")
              path.unlink()

          print(f"State evidence retained: {min(len(files), 100)}")
          PY

      - name: Checkout target branch at target SHA
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: git switch -C "$TARGET_BRANCH" "$TARGET_SHA"

      - name: Generate state
        run: python scripts/generate_state.py

      - name: Commit if changed
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        if: ${{ steps.target.outputs.branch != 'audit/fix-known-compliance-gaps' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PROJECT_STATE.md
          if [ -d evidence/sha_status ]; then
            git add evidence/sha_status
          fi

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-update project state [skip ci]"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
