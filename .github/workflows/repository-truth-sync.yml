name: Repository Truth Synchronization

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "PROJECT_STATE.md"
      - "docs/STATUS.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "PROJECT_INFO.md"
      - "CONTRIBUTING.md"
      - "docs/architecture/overview.md"
      - "evidence/sha_status/**"
      - "evidence/repository_updates/**"
  workflow_run:
    workflows: ["Compliance CI", "ci", "Unit and Contract Verification", "Mutation Testing", "Compliance Registry", "Repository Update Reconciliation"]
    types: [completed]
    branches: ["main"]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: repository-truth-main
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  synchronize:
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate canonical state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATE_EVENT_NAME: ${{ github.event_name }}
          STATE_EVENT_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: python -m scripts.generate_state

      - name: Synchronize repository truth
        run: python scripts/repository_truth.py

      - name: Validate generated surfaces
        run: |
          test -s README.md
          test -s PROJECT_STATE.md
          test -s docs/STATUS.md
          test -s CHANGELOG.md
          test -s ROADMAP.md
          test -s PROJECT_INFO.md
          test -s CONTRIBUTING.md
          test -s docs/architecture/overview.md
          grep -F "<!-- LIVE-STATUS:START -->" README.md
          grep -F "<!-- LIVE-STATUS:END -->" README.md
          SOURCE_SHA=$(python -c "from scripts.generate_state import canonical_source_sha; print(canonical_source_sha())")
          grep -F "SHA: $SOURCE_SHA" PROJECT_STATE.md
          grep -F "Verified product SHA: $SOURCE_SHA" docs/STATUS.md
          if grep -Eq "(Main HEAD SHA|^> Exact SHA:)" PROJECT_STATE.md docs/STATUS.md README.md PROJECT_INFO.md; then
            echo "Self-referential canonical HEAD identity detected; refusing to publish." >&2
            exit 1
          fi

      - name: Commit synchronized surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m scripts.generate_state
            python scripts/repository_truth.py

            test -s README.md
            test -s PROJECT_STATE.md
            test -s docs/STATUS.md
            test -s CHANGELOG.md
            test -s ROADMAP.md
            test -s PROJECT_INFO.md
            test -s CONTRIBUTING.md
            test -s docs/architecture/overview.md
            grep -F "<!-- LIVE-STATUS:START -->" README.md
            grep -F "<!-- LIVE-STATUS:END -->" README.md
            SOURCE_SHA=$(python -c "from scripts.generate_state import canonical_source_sha; print(canonical_source_sha())")
            grep -F "SHA: $SOURCE_SHA" PROJECT_STATE.md
            grep -F "Exact SHA: $SOURCE_SHA" docs/STATUS.md

            git add README.md PROJECT_STATE.md docs/STATUS.md CHANGELOG.md ROADMAP.md PROJECT_INFO.md CONTRIBUTING.md docs/architecture/overview.md evidence/sha_status
            if git diff --cached --quiet; then
              echo "Repository truth already synchronized."
              exit 0
            fi

            git commit -m "chore: synchronize repository truth [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; retrying synchronization (attempt $attempt/3)."
            git reset --hard origin/main
          done

          echo "Failed to synchronize repository truth after 3 attempts."
          exit 1
