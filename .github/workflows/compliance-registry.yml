name: Compliance Registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    name: G04_ARCHITECTURE_DEPENDENCY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical compliance registries
        run: python validation/compliance_registry_validator.py
      - name: Validate architecture ownership, dependencies, and cycles
        run: python validation/architecture_dependency_validator.py
