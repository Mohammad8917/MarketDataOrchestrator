# FILE: .github/workflows/security-scan.yml
name: Security & Supply Chain

on:
  push:
    branches: ["main", "audit/fix-known-compliance-gaps", "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  G06_SECURITY_SUPPLY_CHAIN:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned security tooling
        run: python -m pip install -r constraints-security.txt
      - name: Dependency vulnerability audit
        run: pip-audit -r constraints-ci.txt
      - name: Static security analysis
        run: bandit -r . -x ./tests
      - name: Secret scan against reviewed baseline
        run: detect-secrets scan --all-files --baseline .secrets.baseline
      - name: Export raw secret scan evidence
        if: always()
        run: detect-secrets scan --all-files > /tmp/secrets-raw.json || true
      - name: License inventory
        run: pip-licenses --format=json > /tmp/licenses.json
      - name: Generate SBOM
        run: |
          mkdir -p evidence
          cyclonedx-py environment --of JSON -o evidence/sbom.json
      - name: Upload security evidence
        uses: actions/upload-artifact@v7
        with:
          name: security-supply-chain-evidence
          path: |
            /tmp/secrets-raw.json
            /tmp/licenses.json
            .secrets.baseline
            evidence/sbom.json
          if-no-files-found: error
