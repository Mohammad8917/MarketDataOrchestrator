name: Security & Supply Chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  G06_SECURITY_SUPPLY_CHAIN:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned security tooling
        run: python -m pip install -r constraints-security.txt
      - name: Dependency vulnerability audit
        run: pip-audit -r constraints-ci.txt
      - name: Static security analysis
        run: bandit -r . -x ./tests
      - name: Secret scan
        run: |
          # Generated SHA-state evidence and the scanner baseline contain deterministic hashes, not secrets.
          # Keep the scan fail-closed for all other repository content.
          detect-secrets scan --all-files \
            --exclude-files '.*\\.git/.*' \
            --exclude-files '^evidence/sha_status/.*\\.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/secrets.json").read_text(encoding="utf-8"))
          findings = report.get("results", {})
          if findings:
              print("Secret finding files:", ", ".join(sorted(findings)))
              raise SystemExit(f"Secret findings detected: {len(findings)} files")
          PY
      - name: License inventory
        run: pip-licenses --format=json > /tmp/licenses.json
      - name: Generate SBOM
        run: |
          mkdir -p evidence
          cyclonedx-py environment --of JSON -o evidence/sbom.json
      - name: Upload security evidence
        uses: actions/upload-artifact@v7
        with:
          name: security-supply-chain-evidence
          path: |
            /tmp/secrets.json
            /tmp/licenses.json
            evidence/sbom.json
          if-no-files-found: error
