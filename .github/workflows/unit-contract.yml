name: Unit and Contract Verification

on:
  push:
    branches: [main, 'audit/fix-known-compliance-gaps', 'product/**']
  pull_request:
  workflow_dispatch:

jobs:
  unit-contract:
    name: G03_UNIT_CONTRACT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "pytest>=8.0,<10"
      - name: Run unit and contract tests
        run: python -m pytest -q tests/unit tests/contract
