# RESPONSIBILITY: Execute mutation testing independently from G01-G07 repository verification.
# LAYER: repository-ci
# OWNS: Mutation-test execution and mutation evidence publication.
# DOES_NOT_OWN: G01-G07 gate status, live provider availability, release publication, or exception approval.
# DEPENDENCIES: constraints-ci.txt; pyproject.toml; mutmut
# PYTHON: >=3.13
# LICENSE: Proprietary — All Rights Reserved
# NOTICE: Unauthorized use prohibited without written authorization
# COMPLIANCE: Architecture & Implementation Compliance Kit v1.0

name: Mutation Testing

on:
  push:
    branches: ["main", "audit/fix-known-compliance-gaps"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  MUTATION_TESTING:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: constraints-ci.txt
      - run: python -m pip install -r constraints-ci.txt
      - name: Run mutation testing
        run: mutmut run
      - name: Export mutation evidence
        if: always()
        run: |
          mutmut results --all > mutation-results.txt || true
          mkdir -p evidence
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json evidence/mutation-stats.json 2>/dev/null || true
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence
          path: |
            mutation-results.txt
            evidence/mutation-stats.json
          if-no-files-found: warn
